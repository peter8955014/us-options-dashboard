name: Update US Top 50 Options Data

on:
  schedule:
    # 台灣時間週二～週六 05:30（UTC 週一～週五 21:30）
    # 美股冬令收盤為 UTC 21:00（台 05:00）、夏令為 UTC 20:00（台 04:00）
    # 選在 UTC 21:30 可確保全年冬夏令皆已收盤，且留 30 分鐘讓 Yahoo 結算收盤價與期權鏈
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # 允許隨時到 GitHub Actions 頁面手動點「Run workflow」立即更新

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update_top50.py
        run: python update_top50.py

      - name: Commit and push updated top50.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add top50.json
          git diff --staged --quiet || (git commit -m "chore: update top50.json after US market close" && git push)
