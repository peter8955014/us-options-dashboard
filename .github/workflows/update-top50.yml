name: Update US Top 50 Options Data

on:
  schedule:
    # 台灣時間週二～週六 05:30（美股收盤後 30 分鐘）自動更新
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update_top50.py
        run: python update_top50.py

      - name: Commit and push updated top50.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add top50.json
          git diff --staged --quiet || (git commit -m "chore: update top50.json after US market close" && git push)
